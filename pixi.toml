[workspace]
name = "ha-addon-ssh"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
nodejs = ">=20"
go-shfmt = ">=3"
ruff = ">=0.4"
python = ">=3.11"
pyyaml = ">=6"

[tasks]
fmt = { depends-on = ["fmt-md", "fmt-sh", "fmt-py"] }
fmt-check = { depends-on = ["fmt-check-md", "fmt-check-sh", "fmt-check-py"] }
fmt-md = "npx prettier --write '**/*.md'"
fmt-check-md = "npx prettier --check '**/*.md'"
fmt-sh = "shfmt -w -i 4 -bn -ci -sr ssh/"
fmt-check-sh = "shfmt -d -i 4 -bn -ci -sr ssh/"
fmt-py = "ruff format ssh/"
test = { depends-on = ["test-guard", "test-ask-sensitive", "test-rewrite-tool-path", "test-claude-wrapper", "test-py"] }
test-py = "python3 ssh/tests/test_ha_entities.py && python3 ssh/tests/test_ha_integrations.py && python3 ssh/tests/test_ha_lib.py && python3 ssh/tests/test_ha_history.py && python3 ssh/tests/test_ha_secrets.py"
test-ask-sensitive = "bash ssh/tests/ask-sensitive.test.sh"
test-guard = "bash ssh/tests/guard-destructive.test.sh"
test-rewrite-tool-path = "bash ssh/tests/rewrite-tool-path.test.sh"
test-claude-wrapper = "bash ssh/tests/claude-wrapper.test.sh"
fmt-check-py = "ruff check --select I ssh/ && ruff format --check ssh/"
